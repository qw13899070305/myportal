<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>修改密码</title><style nonce="{{ csp_nonce }}">body{font-family:system-ui;background:#f7f7f7;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
body.dark-mode{background:#121212}.dark-mode .box{background:#1e1e1e;color:#e0e0e0;border-color:#444}.dark-mode input{background:#2c2c2c;color:#e0e0e0;border-color:#555}
.box{background:#fff;padding:30px;border-radius:12px;width:100%;max-width:400px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.1)}h2{color:#333;margin-bottom:20px}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:1rem}button{width:100%;padding:12px;background:#b22222;color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer;margin-top:10px}button:hover{background:#8b1a1a}.error{color:#b22222;margin:10px 0}.msg{color:#2e7d32;margin:10px 0}
#darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}
#darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style></head><body>
<div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
<div class="box"><h2>🔑 修改密码</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="password" name="old_password" placeholder="当前密码" required><input type="password" name="new_password" placeholder="新密码（至少8位，含大小写和数字）" required><input type="password" name="confirm_password" placeholder="确认新密码" required><button>修改密码</button></form>{% if error %}<p class="error">{{ error }}</p>{% endif %}{% if msg %}<p class="msg">{{ msg }}</p>{% endif %}<p style="margin-top:20px"><a href="{{ back_url }}" style="color:#b22222">← 返回</a></p></div>
<script nonce="{{ csp_nonce }}">(function(){if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark-mode");})();function toggleDarkMode(){const isDark=document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",isDark);}</script>
</body></html>
