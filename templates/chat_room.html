<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>聊天室</title>
<meta name="csrf-token" content="{{ csrf_token }}">
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js" nonce="{{ csp_nonce }}"></script>
<style nonce="{{ csp_nonce }}">
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
    body.dark-mode{background:#121212}
    body.dark-mode .chat-container{background:#1e1e1e;color:#e0e0e0}
    body.dark-mode .message .text{background:#2c2c2c;color:#e0e0e0}
    body.dark-mode .chat-input input{background:#2c2c2c;color:#e0e0e0;border-color:#555}
    .chat-container{width:100%;max-width:600px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);overflow:hidden;display:flex;flex-direction:column;height:90vh}
    .chat-header{background:#1890ff;color:#fff;padding:15px 20px;font-size:1.2rem;display:flex;justify-content:space-between;align-items:center}
    .chat-header a{color:#fff;text-decoration:none;font-size:.9rem;margin-left:15px}
    .message-list{flex:1;overflow-y:auto;padding:15px;background:#fafafa}
    .message{margin-bottom:12px;display:flex;flex-direction:column}
    .message .sender{font-size:.8rem;color:#888;margin-bottom:2px;display:flex;align-items:center;gap:5px}
    .message .sender img{width:24px;height:24px;border-radius:50%}
    .message .text{background:#e8f0fe;padding:8px 12px;border-radius:12px;max-width:80%;word-wrap:break-word}
    .message.own{align-items:flex-end}
    .message.own .text{background:#1890ff;color:#fff}
    .chat-input{display:flex;padding:10px;background:#fff;border-top:1px solid #eee}
    .chat-input input{flex:1;padding:10px;border:1px solid #ddd;border-radius:20px;outline:none;font-size:1rem}
    .chat-input button{margin-left:10px;padding:10px 20px;background:#1890ff;color:#fff;border:none;border-radius:20px;cursor:pointer}
    .msg-actions{display:inline-block;margin-left:8px;font-size:.7rem;cursor:pointer;color:#999}
    .mention{color:#1890ff;font-weight:bold}
    #darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}
    #darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style>
</head>
<body>
<div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
<div class="chat-container">
    <div class="chat-header">
        <span>💬 聊天室</span>
        <div><a href="/">🏠 首页</a><a href="/chat/upload_avatar">🖼️ 头像</a><a href="/change_password">🔑 修改密码</a><a href="/chat/logout">退出登录</a></div>
    </div>
    <div class="message-list" id="messages"></div>
    <div class="chat-input">
        <input type="text" id="msgInput" placeholder="输入消息... @用户名 提及" autocomplete="off">
        <button id="sendBtn">发送</button>
    </div>
</div>
<script nonce="{{ csp_nonce }}">
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    const socket = io();
    const msgList = document.getElementById('messages');
    const input = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const currentUser = {{ session.get("chat_username", "")|tojson }};
    let sending = false;
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    function parseMentions(text){
        return escapeHtml(text).replace(/@(\w+)/g, '<span class="mention">@$1</span>');
    }
    function addMessage(user, text, time, isOwn, msgId, canEdit) {
        const div = document.createElement('div');
        div.className = 'message' + (isOwn ? ' own' : '');
        let actions = '';
        if(isOwn && canEdit){
            actions = `<span class="msg-actions" onclick="revokeMessage('${msgId}')">撤回</span>`;
        }
        div.innerHTML = `<div class="sender"><img src="/avatar/${encodeURIComponent(user)}" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%2212%22%20fill%3D%22%23888%22%2F%3E%3Ctext%20x%3D%2212%22%20y%3D%2216%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%20fill%3D%22white%22%3E${escapeHtml(user.charAt(0))}%3C%2Ftext%3E%3C%2Fsvg%3E'">${escapeHtml(user)}</div>
        <div class="text">${parseMentions(text)} <span style="font-size:0.7rem;color:#aaa">${time}</span>${actions}</div>`;
        msgList.appendChild(div);
        msgList.scrollTop = msgList.scrollHeight;
        if(!isOwn && text.includes('@'+currentUser) && Notification.permission === 'granted'){
            new Notification('聊天室提及', {body: user + ' 提到了你'});
        }
    }
    async function revokeMessage(msgId) {
        const resp = await fetch('/chat/revoke', {
            method:'POST',
            headers: {
                'Content-Type':'application/json',
                'X-CSRF-Token': csrfToken,
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({message_id: msgId})
        });
    }
    socket.on('connect', function() {
        socket.emit('join', { username: currentUser });
    });
    socket.on('chat_message', function(data) {
        addMessage(data.user, data.text, data.time, data.user === currentUser, data.id, data.can_edit);
    });
    socket.on('load_messages', function(messages) {
        msgList.innerHTML = '';
        messages.forEach(msg => {
            addMessage(msg.user, msg.text, msg.time, msg.user === currentUser, msg.id, msg.can_edit);
        });
    });
    function sendMessage() {
        if (sending) return;
        const text = input.value.trim();
        if (!text) return;
        sending = true;
        socket.emit('send_message', { text: text, username: currentUser });
        input.value = '';
        setTimeout(() => { sending = false; }, 1000);
    }
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', function(e) { if (e.key === 'Enter') sendMessage(); });
    if(Notification.permission === 'default'){
        Notification.requestPermission();
    }
</script>
<script nonce="{{ csp_nonce }}">(function(){if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark-mode");})();function toggleDarkMode(){const isDark=document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",isDark);}</script>
</body></html>
