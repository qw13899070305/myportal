<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ title|e }} · 待审文章</title><style nonce="{{ csp_nonce }}">*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Noto Serif SC",serif;background:#faf9f6;color:#2c2c2c;line-height:1.8;padding:20px}
body.dark-mode{background:#121212;color:#e0e0e0}
body.dark-mode .container{background:#1e1e1e;border-color:#444}
.container{max-width:760px;margin:40px auto;background:#fff;border:1px solid #e0d6c2;border-radius:6px;padding:40px;box-shadow:0 2px 8px rgba(0,0,0,.04)}h1{font-size:2rem;font-weight:700;margin-bottom:10px;color:#1a1a1a}.meta{font-size:.9rem;color:#8b7355;margin-bottom:20px;font-family:system-ui}.tag{display:inline-block;padding:2px 12px;border-radius:3px;font-size:.75rem;font-family:system-ui;margin-left:10px}.tag.key{background:#fce4e4;color:#8b0000}.tag.fun{background:#fff3e0;color:#e65100}hr{border:none;border-top:1px solid #e0d6c2;margin:20px 0}.content{font-size:1.05rem;line-height:2;word-break:break-word}.back{display:inline-block;margin-top:30px;color:#b22222;text-decoration:none;font-family:system-ui;font-size:.9rem}.back:hover{text-decoration:underline}
#darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}
#darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style></head><body>
<div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
<div class="container"><h1>{{ title|e }} <span style="color:#888;font-size:1rem">(待审核)</span></h1><div class="meta">{{ author|e }} · {{ time }}<span class="tag {{ 'key' if category=='key' else 'fun' }}">{{ '重点新闻' if category=='key' else '娱乐区' }}</span></div><hr><div class="content">{{ content|safe }}</div><a href="/admin/approve_articles" class="back">← 返回审核列表</a></div>
<script nonce="{{ csp_nonce }}">(function(){if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark-mode");})();function toggleDarkMode(){const isDark=document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",isDark);}</script>
</body></html>
