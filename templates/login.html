<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>管理员登录</title><style nonce="{{ csp_nonce }}">
body{font-family:system-ui;background:#1a1a1a;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.box{background:#faf9f6;padding:40px;border-radius:8px;width:100%;max-width:360px;text-align:center;border:1px solid #d4a853}
h2{color:#8b0000;letter-spacing:3px;margin-bottom:30px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #d4a853;border-radius:4px;background:#fdfcf8;font-family:system-ui;box-sizing:border-box}
button{width:100%;padding:12px;background:#b22222;color:white;border:none;border-radius:4px;font-size:1rem;cursor:pointer;letter-spacing:2px;margin-top:10px}
button:hover{background:#8b1a1a}
.error{color:#b22222;margin-top:10px}
.bottom-link{margin-top:25px;font-size:.9rem}
.bottom-link a{color:#d4a853;text-decoration:none}
.bottom-link a:hover{text-decoration:underline}
body.dark-mode{background:#121212}
.dark-mode .box{background:#1e1e1e;color:#e0e0e0;border-color:#444}
.dark-mode input{background:#2c2c2c;color:#e0e0e0;border-color:#555}
.dark-mode h2{color:#ff6b6b}
.pwd-wrapper{position:relative}
.pwd-wrapper input{padding-right:40px}
.pwd-wrapper .toggle-pwd{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.2rem;padding:0;margin:0;width:auto;color:#888}
#darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}
#darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style>
<script nonce="{{ csp_nonce }}">
function togglePwd(btn){
    const input = btn.parentElement.querySelector('input');
    const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
    input.setAttribute('type', type);
    btn.textContent = type === 'password' ? '👁️' : '🙈';
}
(function(){
    if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark-mode');
})();
function toggleDarkMode(){
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('darkMode', isDark);
}
</script></head><body>
<div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
<div class="box"><h2>🔐 管理员登录</h2><form method="post"><input name="username" placeholder="代号" required><div class="pwd-wrapper"><input type="password" name="password" placeholder="密码" required><span class="toggle-pwd" onclick="togglePwd(this)">👁️</span></div><button>登录</button></form>{% if error %}<p style="color:red">{{ error }}</p>{% endif %}{% if lock_remain %}<p style="color:#e67e22">登录失败次数过多，请等待 {{ lock_remain }} 秒后再试</p>{% endif %}<p><a href="/">← 返回</a></p></div>
</body></html>
