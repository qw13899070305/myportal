<!DOCTYPE html><html><head><meta charset="UTF-8"><title>文章审核</title><style nonce="{{ csp_nonce }}">body{font-family:system-ui;max-width:1200px;margin:20px auto;padding:0 10px}body.dark-mode{background:#121212;color:#e0e0e0}.table-container{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;min-width:600px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee}tr{cursor:pointer}tr:hover{background:#fafafa}button{padding:5px 10px;margin:2px}.back-link{margin-bottom:20px;display:inline-block}.excerpt{color:#666;font-size:.9rem;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}#darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}</style></head><body><div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div><h2>📄 待审文章</h2><p><a href="/admin" class="back-link">← 返回管理面板</a></p><div class="table-container"><table><thead><tr><th>标题</th><th>作者</th><th>分类</th><th>内容摘要</th><th>操作</th></tr></thead><tbody>{% for a in articles %}<tr onclick="window.location='/admin/preview_article/{{ a.id }}'"><td>{{ a.title|e }}</td><td>{{ a.author|e }}</td><td>{{ a.category }}</td><td class="excerpt">{{ a.excerpt|e }}</td><td><form method="post" action="/admin/approve_article" style="display:inline" onsubmit="event.stopPropagation()"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="article_id" value="{{ a.id }}"><button>✅ 通过</button></form><form method="post" action="/admin/reject_article" style="display:inline" onsubmit="event.stopPropagation()"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="article_id" value="{{ a.id }}"><button>❌ 拒绝</button></form></td></tr>{% endfor %}</tbody></table></div><script nonce="{{ csp_nonce }}">(function(){if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark-mode");})();function toggleDarkMode(){const isDark=document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",isDark);}</script></body></html>
