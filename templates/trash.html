<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>缓存区</title><style nonce="{{ csp_nonce }}">body{font-family:system-ui,sans-serif;max-width:900px;margin:20px auto;padding:0 15px}h1{font-weight:400}
body.dark-mode{background:#121212;color:#e0e0e0}
.table-container{overflow-x:auto}table{width:100%;min-width:600px;border-collapse:collapse;margin:20px 0}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}button{padding:5px 10px;margin-right:5px;cursor:pointer}.back-link{margin-bottom:20px;display:inline-block}
#darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}
#darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style></head><body>
<div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
<h1>🗑️ 缓存区</h1><p><a href="/admin" class="back-link">← 返回管理面板</a></p><div class="table-container"><table><thead><tr><th>文件名</th><th>原路径</th><th>大小</th><th>操作</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.name|e }}</td><td>{{ item.original_path|e }}</td><td>{{ item.size }}</td><td><form method="post" action="/admin/trash/restore" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="filename" value="{{ item.name }}"><input type="hidden" name="current_path" value="{{ item.current_path }}"><button type="submit" style="background:#4CAF50;color:#fff;border:none;border-radius:4px">↩️ 恢复</button></form><form method="post" action="/admin/trash/delete" style="display:inline" onsubmit="return confirm('彻底删除？');"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="filename" value="{{ item.name }}"><input type="hidden" name="current_path" value="{{ item.current_path }}"><button type="submit" style="background:#f44336;color:#fff;border:none;border-radius:4px">❌ 删除</button></form></td></tr>{% endfor %}</tbody></table></div>
<script nonce="{{ csp_nonce }}">(function(){if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark-mode");})();function toggleDarkMode(){const isDark=document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",isDark);}</script>
</body></html>
