<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}万象门户{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <style nonce="{{ csp_nonce }}">
        *{box-sizing:border-box;}
        body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#f0f2f5;}
        body.dark-mode{background:#121212;color:#e0e0e0;}
        .container{max-width:1200px;margin:0 auto;}
        a{color:#b22222;text-decoration:none;}
        button{cursor:pointer;}
        #darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999;}
        #darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
    </style>
    {% block extra_css %}{% endblock %}
    <script nonce="{{ csp_nonce }}">
        function toggleDarkMode(){
            const isDark = document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }
        (function(){
            if(localStorage.getItem('darkMode')==='true') document.body.classList.add('dark-mode');
        })();
    </script>
    {% block head_scripts %}{% endblock %}
</head>
<body>
    <div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
    <div class="container">{% block content %}{% endblock %}</div>
    {% block body_scripts %}{% endblock %}
</body>
</html>
