<!DOCTYPE html><html><head><meta charset="UTF-8"><title>审计日志</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style nonce="{{ csp_nonce }}">body{font-family:system-ui,sans-serif;max-width:1000px;margin:20px auto;padding:15px}
body.dark-mode{background:#121212;color:#e0e0e0}
.log-container{background:#f5f5f5;padding:15px;border-radius:6px;font-family:monospace;white-space:pre-wrap;max-height:70vh;overflow-y:auto}.back-link{margin-bottom:20px;display:inline-block}
#darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}
#darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style></head><body>
<div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
<h1>📋 审计日志</h1><p><a href="/admin" class="back-link">← 返回管理面板</a></p><div class="log-container">{{ log_content }}</div>
<script nonce="{{ csp_nonce }}">(function(){if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark-mode");})();function toggleDarkMode(){const isDark=document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",isDark);}</script>
</body></html>
