<!DOCTYPE html><html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>编辑文章</title><style nonce="{{ csp_nonce }}">body{font-family:system-ui,sans-serif;background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
body.dark-mode{background:#121212}.dark-mode .box{background:#1e1e1e;color:#e0e0e0;border-color:#444}
.box{background:#fff;padding:30px;border-radius:12px;width:100%;max-width:700px;box-shadow:0 2px 12px rgba(0,0,0,.1)}h2{color:#b22222;margin-bottom:20px}label{display:block;margin:10px 0 5px;font-weight:600}input,select,textarea{width:100%;padding:10px;margin-bottom:15px;border:1px solid #ddd;border-radius:6px;font-size:1rem}textarea{height:300px;resize:vertical}.tag-input{display:flex;gap:10px;margin-bottom:10px}.tag-list{margin-bottom:10px;display:flex;flex-wrap:wrap;gap:5px}.tag{background:#f0e8d8;padding:2px 8px;border-radius:12px;font-size:.8rem}.tag-remove{cursor:pointer;margin-left:5px;color:#b22222}button{width:100%;padding:12px;background:#b22222;color:#fff;border:none;border-radius:6px;font-size:1rem;cursor:pointer}.error{color:#b22222;margin:10px 0}.msg{color:#2e7d32;margin:10px 0}
#darkModeFloating{position:fixed;bottom:20px;right:20px;z-index:9999}
#darkModeFloating button{background:#333;color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.5rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.3)}
</style></head><body>
<div id="darkModeFloating"><button onclick="toggleDarkMode()">🌓</button></div>
<div class="box"><h2>✏️ 编辑文章</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>标题</label><input type="text" name="title" value="{{ article.title|e }}" required><label>分类</label><select name="category"><option value="key" {{ 'selected' if article.category=='key' else '' }}>🔴 重点新闻</option><option value="fun" {{ 'selected' if article.category=='fun' else '' }}>🎮 娱乐区</option>{% if can_internal %}<option value="internal" {{ 'selected' if article.category=='internal' else '' }}>🔒 内部</option>{% endif %}</select><label>标签</label><div class="tag-input"><input type="text" id="tagInput" placeholder="添加标签"><button type="button" onclick="addTag()" style="width:auto">+</button></div><input type="hidden" name="tags" id="tagsHidden"><div id="tagList" class="tag-list">{% for tag in tags %}<span class="tag">{{ tag|e }}<span class="tag-remove" onclick="removeTag('{{ tag }}')">×</span></span>{% endfor %}</div><label>内容</label><textarea name="content" required>{{ article.content }}</textarea><button type="submit">保存修改</button></form>{% if error %}<p class="error">{{ error }}</p>{% endif %}{% if msg %}<p class="msg">{{ msg }}</p>{% endif %}<p style="margin-top:20px"><a href="{{ back_url }}" style="color:#b22222">← 返回</a></p></div>
<script nonce="{{ csp_nonce }}">let tags={{ tags|tojson }};function addTag(){const input=document.getElementById('tagInput'),val=input.value.trim();if(val&&!tags.includes(val)&&tags.length<5){tags.push(val);renderTags();input.value='';}}function removeTag(tag){tags=tags.filter(t=>t!==tag);renderTags();}function renderTags(){const container=document.getElementById('tagList');container.innerHTML=tags.map(t=>`<span class="tag">${escapeHtml(t)}<span class="tag-remove" onclick="removeTag('${t}')">×</span></span>`).join('');document.getElementById('tagsHidden').value=tags.join(',');}function escapeHtml(str){return str.replace(/[&<>]/g,function(m){if(m==='&')return '&amp;';if(m==='<')return '&lt;';if(m==='>')return '&gt;';return m;});}</script>
<script nonce="{{ csp_nonce }}">(function(){if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark-mode");})();function toggleDarkMode(){const isDark=document.body.classList.toggle("dark-mode");localStorage.setItem("darkMode",isDark);}</script>
</body></html>
